<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumi</title>
<style>
  :root { --bg: #fafaf7; --fg: #222; --muted: #666; --link: #2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161616; --fg: #eee; --muted: #aaa; --link: #7aa7ff; } }
  body { background: var(--bg); color: var(--fg); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 48px 16px; }
  main { max-width: 640px; margin: 0 auto; }
  p.muted { color: var(--muted); }
  a { color: var(--link); }
</style>
</head>
<body>
<main>
  <h1>Lumi</h1>
  <p>Lumi is a private assistant for one household. Family members chat with it to manage the family calendar, to-do lists, notes and the home server.</p>
  <p>It is not a public service. Only the household's own Google accounts are connected to it.</p>
  <p><a href="privacy.html">Privacy policy</a></p>
  <p class="muted">Contact: gggz.lumi@gmail.com</p>
</main>
</body>
</html>
